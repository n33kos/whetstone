    summary: "Streaming results lazily without buffering — Node streams, paginated APIs, server-sent events."
    prereqs: [promises-internals]
    languages: [typescript]
    tags: [hands-on, async]

  - id: generators-coroutines
    title: "Generators and coroutines"
