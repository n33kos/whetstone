# Whetstone catalog of topics
#
# Each topic is the seed of a lesson — five to ten lines of YAML the planner
# uses to pick what to teach today. Detailed lesson content is generated at
# lesson-time, not pre-authored.
#
# Schema (one entry):
#   id:               kebab-case stable identifier (used in knowledge-map.yml)
#   title:            human title shown in lesson header
#   section:          top-level catalog section (used for "unvisited region" exploration)
#   summary:          one-line description
#   prereqs:          list of topic ids the user should be comfy with first (optional)
#   related:          list of topic ids that often co-occur (optional)
#   sources:          list of source ids from sources.yml
#   languages:        list of language slugs this topic works well in (default: any)
#                     valid: typescript, ruby, any
#   tags:             optional free-form tags (theory, hands-on, classic, modern, etc.)

topics:

  # ─────────────────────────────────────────────────────────────────────
  # Language fundamentals
  # ─────────────────────────────────────────────────────────────────────

  - id: structural-vs-nominal-types
    title: "Structural vs nominal type systems"
    section: language-fundamentals
    summary: "Why TypeScript's `{name: string}` matches anything with that shape, and what nominal typing buys you."
    related: [variance, branded-types, parametricity]
    sources: [tapl]
    languages: [typescript]
    tags: [theory, type-systems]

  - id: variance
    title: "Variance: covariance, contravariance, bivariance, invariance"
    section: language-fundamentals
    summary: "Why `Array<Dog>` is not safely an `Array<Animal>`, and what TypeScript's `--strictFunctionTypes` actually does."
    prereqs: [structural-vs-nominal-types]
    sources: [tapl]
    languages: [typescript]
    tags: [theory, type-systems]

  - id: parametricity
    title: "Parametricity and free theorems"
    section: language-fundamentals
    summary: "What you can deduce from a polymorphic type signature alone — Reynolds' insight."
    sources: [tapl]
    languages: [typescript]
    tags: [theory, type-systems]

  - id: branded-types
    title: "Branded / opaque types in TypeScript"
    section: language-fundamentals
    summary: "Making `UserId` and `OrderId` not assignable to each other in a structural system."
    prereqs: [structural-vs-nominal-types]
    languages: [typescript]
    tags: [hands-on, type-systems]

  - id: discriminated-unions
    title: "Discriminated unions and exhaustiveness checking"
    section: language-fundamentals
    summary: "Tagged unions, `never`-based exhaustiveness, and why sum types beat boolean flags."
    languages: [typescript]
    tags: [hands-on, type-systems]

  - id: ts-conditional-types
    title: "Conditional types and `infer`"
    section: language-fundamentals
    summary: "Type-level if/else and pattern matching — the engine behind `ReturnType`, `Awaited`, `Parameters`."
    prereqs: [discriminated-unions]
    languages: [typescript]
    tags: [hands-on, type-systems, advanced]

  - id: ts-mapped-types
    title: "Mapped types and key remapping"
    section: language-fundamentals
    summary: "How `Partial`, `Readonly`, `Pick`, `Omit` are built — and how to write your own."
    languages: [typescript]
    tags: [hands-on, type-systems]

  - id: ts-template-literal-types
    title: "Template literal types"
    section: language-fundamentals
    summary: "Computing strings at the type level — route typing, CSS-in-JS keys, event names."
    prereqs: [ts-mapped-types]
    languages: [typescript]
    tags: [hands-on, advanced]

  - id: js-event-loop
    title: "The JavaScript event loop, macrotasks, and microtasks"
    section: language-fundamentals
    summary: "Why `Promise.resolve().then(...)` runs before `setTimeout(..., 0)`."
    languages: [typescript]
